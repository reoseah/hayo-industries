plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id("io.freefair.lombok") version "9.1.0"
}

version = project.mod_version
group = project.maven_group

repositories {
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
        metadataSources {
            mavenPom()
            artifact()
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Cassian's Maven"
                url = uri("https://maven.cassian.cc")
            }
        }
        filter {
            includeGroupAndSubgroups("cc.cassian")
        }
    }
}

allprojects {
    version = rootProject.version

    apply plugin: "net.fabricmc.fabric-loom"

    dependencies {
        minecraft "com.mojang:minecraft:${project.minecraft_version}"
        api "net.fabricmc:fabric-loader:${project.loader_version}"

        implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    }

    processResources {
        def version = project.version
        inputs.property "version", version

        filesMatching("fabric.mod.json") {
            expand "version": version
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
    }

    java {
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    jar {
        def projectName = project.name
        inputs.property "projectName", projectName

        from("LICENSE") {
            rename { "${it}_$projectName"}
        }
    }
}

sourceSets {
    main {
        java {
//            exclude 'hayo/mod_support/jei/**'
//            exclude 'hayo/mod_support/rrv/**'
        }
    }
}

dependencies {
    api("mezz.jei:jei-${project.minecraft_version}-fabric-api:+")
//    implementation("mezz.jei:jei-${project.minecraft_version}-fabric:+")

    implementation("cc.cassian.rrv:reliable-recipe-viewer-fabric:${rrv_version}+${minecraft_version}")

    implementation project(':hayo-energy')
    include project(':hayo-energy')
}

loom {
    accessWidenerPath = file("src/main/resources/hayo.classtweaker")
}