plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id("io.freefair.lombok") version "9.1.0"
}

version = project.mod_version
group = project.maven_group

repositories {
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
        metadataSources {
            mavenPom()
            artifact()
        }
    }
}

allprojects {
    apply plugin: "net.fabricmc.fabric-loom"

    dependencies {
        minecraft "com.mojang:minecraft:${project.minecraft_version}"
        api "net.fabricmc:fabric-loader:${project.loader_version}"

        implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    }

    processResources {
        inputs.property "version", project.version

        filesMatching("fabric.mod.json") {
            expand "version": inputs.properties.version
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
    }

    java {
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    jar {
        inputs.property "archivesName", project.base.archivesName

        from("LICENSE") {
            rename { "${it}_${inputs.properties.archivesName}" }
        }
    }
}

dependencies {
    api("mezz.jei:jei-${project.minecraft_version}-fabric-api:+")
    implementation("mezz.jei:jei-${project.minecraft_version}-fabric:+")

    implementation project(':hayo-energy')
    include project(':hayo-energy')
}

loom {
    accessWidenerPath = file("src/main/resources/hayo.classtweaker")
}